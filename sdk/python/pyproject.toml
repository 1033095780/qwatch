[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qwatch"
version = "0.1.0"
description = "qwatch strategy ingestion SDK — heartbeat and signals in one request"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "qwatch" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]

[tool.hatch.build.targets.wheel]
packages = ["qwatch"]
